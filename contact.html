	<main>
        
        <!-- RD Mailform -->
        <section class="well-md">
            <div class="container">
                <h2 class="border min-width-4">Contact form</h2>
                <div class="row inset-5">
                    <form class='mailform rd-mailform' method="post" action="process.php">
                        <input type="hidden" name="form-type" value="contact"/>
                        <fieldset>
                            <div class="col-sm-4 col-md-4">
                                <label data-add-placeholder="">
                                    <input type="text"
                                           name="name"
                                           placeholder="Name"
                                           data-constraints="@LettersOnly @NotEmpty"/>
                                </label>     
                            </div>

                            <div class="col-sm-4 col-md-4">
                                <label data-add-placeholder="">
                                    <input type="text"
                                           name="phone"
                                           placeholder="Phone"
                                           data-constraints="@Phone" required/>
                                </label>
                            </div>

                            <div class="col-sm-4 col-md-4">
                                <label data-add-placeholder="">
                                    <input type="text"
                                           name="email"
                                           placeholder="Email"
                                           data-constraints="@Email @NotEmpty" required/>
                                </label>
                            </div>
                            
                            <div class="col-xs-12">
                                <label data-add-placeholder="">
                                    <textarea name="message" placeholder="Message"
                                              data-constraints="@NotEmpty"></textarea>
                                </label>
                            </div>

                            <div class="mfControls">
                                <button class="link link-md link-contrast border border-md" type="submit">Send</button>
                            </div>
                        </fieldset>
                    </form>
                </div>
            </div>
        </section>
        <!-- END RD Mailform -->


        <!-- Google Maps -->
        <section class="box-hover relative">
